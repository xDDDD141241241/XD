<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#E9ECF1; --panel:#FBFCFD; --ink:#0E141B; --muted:#63748A;
    --rule:#C4CEDA; --track:#D8DFE8;
    --calm:#2A7F62; --caution:#C07A1E; --danger:#B02A24; --acute:#7B1E1A;
    --display:'IBM Plex Sans Condensed',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 72px}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  header{display:flex;justify-content:space-between;align-items:baseline;
         gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
  h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.14em;
     text-transform:uppercase;margin:0}
  .stamp{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  /* ---- headline reading ---- */
  .read{background:var(--panel);border:1px solid var(--rule);border-top:none;
        padding:22px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  .score{font-family:var(--display);font-weight:700;font-size:76px;line-height:.85;
         letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .score .pctl{font-size:9.5px;letter-spacing:.05em;color:var(--muted);margin-top:4px;
               text-transform:none}
  .score small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;
               letter-spacing:.16em;margin-top:10px;text-transform:uppercase}
  .plain{font-size:17px;max-width:52ch}
  .plain strong{font-weight:600}
  .regime{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);
          margin-top:10px;display:block;text-transform:uppercase}
  .spark{margin-top:14px}
  .trend{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .topbox{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;
          align-items:center;border-top:1px solid var(--rule);padding-top:12px;
          font-size:13px;max-width:56ch}
  .topnum{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;
          font-variant-numeric:tabular-nums}
  .tf{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:3px 7px;
      border:1px solid var(--rule);background:#fff;display:inline-flex;gap:5px;align-items:baseline}
  .tf b{font-weight:600}
  .tf i{font-style:normal;color:var(--muted)}
  .tf.up{border-left:3px solid var(--calm)}
  .tf.dn{border-left:3px solid var(--caution)}

  /* ---- signature: the percentile ladder stack ---- */
  section{margin-top:34px}
  h2{font-family:var(--display);font-size:12.5px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
  .lede{font-size:13.5px;color:var(--muted);margin:0 0 16px;max-width:62ch}

  .ladder{list-style:none;margin:0;padding:0}
  .fam{margin-bottom:22px}
  .famhead{display:grid;grid-template-columns:1fr 168px 62px;gap:14px;align-items:center;
           font-family:var(--display);font-size:12px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--ink);padding-bottom:5px}
  .fambar{position:relative;height:5px;background:var(--track);border-radius:1px}
  .fambar i{position:absolute;left:0;top:0;bottom:0;border-radius:1px}
  .famnum{font-family:var(--mono);font-size:11px;text-align:right;color:var(--muted)}
  .rung{display:grid;grid-template-columns:1fr 168px 62px;gap:14px;align-items:start;
        padding:11px 0;border-bottom:1px solid var(--rule)}
  .rung:first-child{border-top:1px solid var(--rule)}
  .name{font-size:14px}
  .note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .check{display:block;font-size:12px;color:var(--ink);opacity:.72;margin-top:5px;
         padding-left:9px;border-left:2px solid var(--rule);max-width:58ch}
  .guide{margin-top:7px;padding-left:9px;border-left:2px solid var(--rule);max-width:60ch}
  .guide div{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:12px;
             line-height:1.5;margin-bottom:3px;color:var(--ink);opacity:.82}
  .guide b{font-weight:600;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
           color:var(--muted);padding-top:2px}
  .guide .w b{color:var(--danger);opacity:.85}
  .track{position:relative;height:16px;background:var(--track);border-radius:1px}
  .track i{position:absolute;top:-3px;width:3px;height:22px;background:var(--ink);
           transform:translateX(-1.5px)}
  .track b{position:absolute;top:0;bottom:0;left:0;opacity:.30}
  .track u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#fff;opacity:.7}
  .figs{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .figs em{display:block;font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.03em}

  /* ---- signals ---- */
  .sig{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start;
       padding:11px 0;border-bottom:1px solid var(--rule)}
  .sig:first-child{border-top:1px solid var(--rule)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--track);margin-top:6px}
  .sig.on .dot{background:var(--danger)}
  .sig.on.good .dot{background:var(--calm)}
  .sig .lbl{font-weight:600;font-size:14px}
  .sig.off{color:var(--muted)}
  .sig.off .lbl{font-weight:400}
  .sig .mean{font-size:12.5px;color:var(--muted)}

  .trust{border:1px solid var(--rule);border-bottom:none;background:var(--panel);
         padding:12px 22px;font-size:13.5px}
  .trust.ok{color:var(--calm)}
  .trust.warn{background:#FBF1DF;border-color:#E4CDA0;color:#7A5210}
  .trust.fail{background:#F6E4E2;border-color:#DFB3AE;color:#8C201A}
  .trust .ck{font-size:12.5px;color:inherit;opacity:.85;margin-top:3px}
  .read.dim{opacity:.5}
  .score .muted-note{font-size:9.5px;letter-spacing:.06em;color:var(--danger);
                     margin-top:6px;max-width:150px;line-height:1.35}
  .foot{margin-top:34px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);
        padding-top:14px}
  .warn{background:#F6E9E7;border:1px solid #E0BDB8;padding:12px 14px;font-size:13px;
        margin-top:16px}
  .empty{background:var(--panel);border:1px solid var(--rule);padding:28px;margin-top:20px}
  .stale.thin{background:#6B7A8C}
  .inv.clip{border-color:var(--caution);color:var(--caution)}
  .inv{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
       color:var(--muted);border:1px solid var(--rule);padding:1px 4px;vertical-align:2px}
  .stale{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
         background:var(--caution);color:#fff;padding:1px 5px;border-radius:2px;vertical-align:2px}
  code{font-family:var(--mono);font-size:12.5px;background:var(--track);padding:1px 5px}

  /* ---- price state ---- */
  .pstate{margin-top:12px;border:1px solid var(--rule);background:#fff;padding:9px 11px;
          font-size:13px;min-width:0;max-width:100%}
  .pstate .pl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em}
  .pstate .pf{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
  .pstate .pn{font-size:12.5px;margin-top:6px}
  details.more{margin-top:6px;font-size:12.5px}
  details.more summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:11px}

  /* ---- per-gauge history ---- */
  .past{display:block;font-size:12px;margin-top:7px;padding-left:9px;
        border-left:2px solid var(--rule);max-width:60ch;color:var(--ink);opacity:.9}
  .past .v-worse{color:var(--danger);font-weight:600}
  .past .v-same{color:var(--muted);font-weight:600}
  .past .v-better{color:var(--calm);font-weight:600}
  .hbtn{margin-top:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
        background:none;border:1px solid var(--rule);padding:3px 8px;cursor:pointer;color:var(--ink)}
  .hbtn:hover{background:#fff}
  .rung>*{min-width:0}
  .hist{grid-column:1/-1;min-width:0;background:var(--panel);border:1px solid var(--rule);padding:12px 14px;
        margin-top:4px}
  .hist[hidden]{display:none}
  .hist .rd{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:1.5em}
  .tbl{overflow-x:auto;margin-top:10px}
  .tbl table{border-collapse:collapse;font-size:12px;width:100%;min-width:560px}
  .tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
          color:var(--muted);font-weight:500;text-align:right;padding:4px 6px;
          border-bottom:1px solid var(--rule)}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{font-family:var(--mono);text-align:right;padding:4px 6px;border-bottom:1px solid var(--track);
          font-variant-numeric:tabular-nums}
  .tbl tr.now td{background:#FBF1DF;font-weight:600}
  .tbl tr.base td{color:var(--muted);border-top:1px solid var(--rule)}
  .hist h3{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
           color:var(--muted);margin:14px 0 2px;font-weight:600}

  @media (max-width:620px){
    .guide div{grid-template-columns:1fr;gap:0}
    .guide b{display:block;margin-top:4px}
    .read{grid-template-columns:1fr;gap:16px}
    .score{font-size:62px}
    .rung{grid-template-columns:1fr 84px;grid-template-areas:"n f" "t t";gap:6px 12px}
    .name{grid-area:n}.figs{grid-area:f}.track{grid-area:t}
  }
  @media (prefers-reduced-motion:no-preference){
    .rung,.sig{animation:in .4s ease both}
  }
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Risk Monitor</h1>
    <span class="stamp" id="stamp">loading…</span>
  </header>
  <div id="app"></div>
</div>

<script>
const BANDS = [
  {max:35, key:'CALM',      color:'var(--calm)',    say:'Nothing in the complex is flashing. Normal conditions.'},
  {max:60, key:'ELEVATED',  color:'var(--caution)', say:'Some gauges are running warm. Worth a look, not a reaction.'},
  {max:80, key:'STRESSED',  color:'var(--danger)',  say:'Several gauges are stretched at once. This is when position size matters.'},
  {max:101,key:'ACUTE',     color:'var(--acute)',   say:'Broad, simultaneous stress. Historically the tail of the distribution.'}
];
const band = s => BANDS.find(b => s < b.max) || BANDS[3];
const colorFor = p => p >= 80 ? 'var(--danger)' : p >= 60 ? 'var(--caution)' : 'var(--calm)';

const REGIME = {
  BULL:          'Price above trend and participation is broad.',
  DETERIORATING: 'Price is still holding up, but fewer stocks are carrying it.',
  CORRECTION:    'Price has broken trend, though breadth has not confirmed real damage.',
  BEAR:          'Both price trend and participation are broken.'
};

function toppingStrip(t){
  if(!t || t.score==null) return '';
  const c = t.score>=60?'var(--danger)':t.score>=40?'var(--caution)':'var(--calm)';
  return `<div class="topbox">
    <div><div class="topnum" style="color:${c}">${t.score}</div>
      ${t.percentile!=null?`<div class="stamp" style="text-align:center">${t.percentile} pctl</div>`:''}</div>
    <div><b>Topping risk</b> — internals deteriorating while the surface stays calm.
      Separate from the score above, which measures stress and is meant to be low at a top.
      <div class="stamp" style="margin-top:4px">surface ${t.surface} · internals ${t.internals}
        · calm factor ${t.calm_factor}</div>
      ${t.drivers&&t.drivers.length?`<div class="stamp">driven by: ${
        t.drivers.map(x=>`${x.label} (${x.percentile})`).join(' · ')}</div>`:''}
    </div></div>`;
}

function trendStrip(t){
  if(!t || !t.length) return '';
  return `<div class="trend">${t.map(x => `
    <span class="tf ${x.above?'up':'dn'}">
      <b>${x.span}${x.kind}</b>${x.above?'above':'below'}
      <i>${x.dist_pct>0?'+':''}${x.dist_pct}%</i></span>`).join('')}
    <div class="stamp" style="margin-top:6px">price vs each horizon — short and long can disagree, and usually do in a pullback</div></div>`;
}


// ---------------------------------------------------------------------------
// What happened next: price state and per-gauge history
// ---------------------------------------------------------------------------
const pc = v => v==null ? '–' : (v>0?'+':'') + v.toFixed(1) + '%';
const yr = s => s ? s.slice(0,4) : '';

// A plain verdict on whether past spells looked worse than an ordinary day.
// Descriptive only: it labels the table, it never feeds the score.
function verdict(h){
  if(!h || !h.enough || h.lower_1m==null || h.base_lower_1m==null) return null;
  const worse = (h.lower_1m >= h.base_lower_1m + 10) || (h.med_dd!=null && h.med_dd <= h.base_med_dd - 1.5);
  const better = (h.lower_1m <= h.base_lower_1m - 10) && (h.med_dd!=null && h.med_dd >= h.base_med_dd + 1);
  return worse ? ['v-worse','worse than an ordinary day']
       : better ? ['v-better','better than an ordinary day']
       : ['v-same','about the same as an ordinary day'];
}

function priceStrip(ps){
  if(!ps || !ps.state) return '';
  const H = ps.history || {};
  const row = (H.table||[]).find(r => r.state === ps.state);
  const base = H.baseline;
  const near = ps.state === 'range_high' || ps.state === 'pause';
  const tone = {at_high:'var(--calm)', pause:'var(--calm)', range_high:'var(--caution)',
                pullback:'var(--caution)', correction:'var(--danger)', deep:'var(--acute)'}[ps.state];
  let teaser = '';
  if(row && base && row.episodes_done >= 3){
    teaser = `Since ${yr(H.since)} there were ${row.episodes_done} separate spells in this state.
      A month later the index was lower on <b>${row.lower_1m}%</b> of those days
      (any day: ${base.lower_1m}%); the typical worst dip over the next three months was
      <b>${pc(row.med_dd)}</b> (any day: ${pc(base.med_dd)}).`;
  } else if(row){
    teaser = `Only ${row.episodes_done} past spell${row.episodes_done===1?'':'s'} in this state since ${yr(H.since)} — too few to draw anything from.`;
  }
  const table = (H.table||[]).length ? `<details class="more"><summary>what happened next, by price state</summary>
    <div class="tbl"><table>
      <tr><th>State</th><th>Share of days</th><th>Spells</th><th>Lower 1 month later</th>
          <th>Median 3-month change</th><th>Median worst dip, 3m</th><th>Worst dip, 3m</th></tr>
      ${H.table.map(r=>`<tr class="${r.state===ps.state?'now':''}"><td>${r.label}</td><td>${r.share??'–'}%</td>
        <td>${r.episodes_done}</td><td>${r.lower_1m??'–'}${r.lower_1m!=null?'%':''}</td>
        <td>${pc(r.med_3m)}</td><td>${pc(r.med_dd)}</td><td>${pc(r.worst_dd)}</td></tr>`).join('')}
      <tr class="base"><td>All days</td><td>100%</td><td>–</td><td>${base.lower_1m}%</td>
        <td>${pc(base.med_3m)}</td><td>${pc(base.med_dd)}</td><td>${pc(base.worst_dd)}</td></tr>
    </table></div>
    <p class="stamp" style="margin-top:6px">Index is SPY, price only. “Lower 1 month later” and the dip columns
      count every day in the state; “Spells” is how many separate episodes those days come from —
      that is the real sample size.</p></details>` : '';
  return `<div class="pstate">
    <div class="pl" style="color:${tone}">${ps.label}</div>
    <div class="pf">${ps.pct_from_high>0?'+':''}${ps.pct_from_high}% from the one-year high ·
      ${ps.days_since_high} session${ps.days_since_high===1?'':'s'} since the last one ·
      ${ps.range_position}% up its one-year range · last two months moved inside a ${ps.band_42d}% band</div>
    ${near ? `<div class="pn">No fresh high, but not far below one. Where a gauge below says
      <em>“while the index makes new highs”</em>, read it as applying here too.</div>` : ''}
    ${teaser ? `<div class="pn">${teaser}</div>` : ''}
    ${table}
  </div>`;
}

function pastLine(i){
  const h = i.history;
  if(!h) return '';
  const v = verdict(h);
  const lag = h.lag ? ' Weekly data, held back a week to match when it was actually published.' : '';
  if(!h.enough) return `<span class="past">Readings this loud (${h.bucket}) happened in only
    ${h.episodes_done} separate spell${h.episodes_done===1?'':'s'} since ${yr(h.since)} — too few to judge.${lag}</span>`;
  return `<span class="past">Past readings this loud (${h.bucket}): ${h.episodes_done} separate spells since ${yr(h.since)}.
    A month later the index was lower on ${h.lower_1m}% of those days (any day ${h.base_lower_1m}%);
    typical worst dip over three months ${pc(h.med_dd)} (any day ${pc(h.base_med_dd)}) —
    <span class="${v[0]}">${v[1]}</span>.${lag}</span>`;
}

let GAUGES = null;
function loadGauges(file){
  if(!GAUGES) GAUGES = fetch((file||'gauges.json') + '?t=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .catch(e => { GAUGES = null; throw e; });
  return GAUGES;
}

function gaugeChart(G, g, id){
  const n = G.dates.length, W = 880, PL = 34, PR = 10, PT = 8, H1 = 120, GAP = 14, H2 = 90;
  const H = PT + H1 + GAP + H2 + 22, iw = W - PL - PR, T2 = PT + H1 + GAP;
  const X = k => PL + k/(n-1)*iw;
  const Y1 = v => PT + (100-v)/100*H1;
  const sp = G.spy.map(v => v>0 ? Math.log(v) : null).filter(v=>v!=null);
  const lo = Math.min(...sp), hi = Math.max(...sp);
  const Y2 = v => T2 + (hi-Math.log(v))/(hi-lo||1)*H2;
  const B = [[0,20],[20,40],[40,60],[60,80],[80,100]][g.today_bucket];

  let p1 = '', pen = false;
  g.reading.forEach((v,k) => { if(v==null){pen=false;return;}
    p1 += (pen?'L':'M') + X(k).toFixed(1) + ' ' + Y1(v).toFixed(1) + ' '; pen = true; });
  const p2 = G.spy.map((v,k) => (k?'L':'M') + X(k).toFixed(1) + ' ' + Y2(v).toFixed(1)).join(' ');

  // shade the stretches when the gauge was in today's bucket, across both panels
  let shade = '', s0 = null;
  const inB = v => v!=null && v >= B[0] && (v < B[1] || B[1]===100);
  for(let k=0;k<=n;k++){
    const on = k<n && inB(g.reading[k]);
    if(on && s0===null) s0 = k;
    if(!on && s0!==null){ shade += `<rect x="${X(s0).toFixed(1)}" y="${PT}" width="${Math.max(X(k-1)-X(s0),1.2).toFixed(1)}"
        height="${T2+H2-PT}" fill="var(--caution)" opacity=".13"/>`; s0 = null; }
  }
  const yrs = []; let last = '';
  G.dates.forEach((d,k) => { const y = d.slice(0,4); if(y!==last){ last = y; if(k>0) yrs.push([y,k]); } });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" data-chart="${id}" style="touch-action:pan-y"
      role="img" aria-label="${g.label} reading and index price since ${G.dates[0]}">
    <rect x="${PL}" y="${Y1(B[1]===100.01?100:B[1])}" width="${iw}" height="${Y1(B[0])-Y1(Math.min(B[1],100))}"
      fill="var(--caution)" opacity=".10"/>
    ${[0,50,100].map(v=>`<line x1="${PL}" y1="${Y1(v)}" x2="${W-PR}" y2="${Y1(v)}" stroke="var(--rule)" stroke-width=".6"/>
      <text x="${PL-5}" y="${Y1(v)+3}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join('')}
    <rect x="${PL}" y="${T2}" width="${iw}" height="${H2}" fill="#fff" stroke="var(--rule)" stroke-width=".6"/>
    ${shade}
    ${yrs.map(([y,k])=>`<line x1="${X(k)}" y1="${PT}" x2="${X(k)}" y2="${T2+H2}" stroke="var(--rule)"
        stroke-width=".6" stroke-dasharray="2 3"/>
      <text x="${X(k)}" y="${H-6}" text-anchor="middle" font-size="9" font-family="var(--mono)" fill="var(--muted)">${y}</text>`).join('')}
    <path d="${p1}" fill="none" stroke="#2C3A47" stroke-width="1"/>
    <path d="${p2}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
    <text x="${PL+4}" y="${PT+11}" font-size="9.5" font-family="var(--mono)" fill="var(--muted)">GAUGE READING, 0–100</text>
    <text x="${PL+4}" y="${T2+12}" font-size="9.5" font-family="var(--mono)" fill="var(--muted)">INDEX (SPY, LOG SCALE)</text>
    <line class="xh" x1="0" y1="${PT}" x2="0" y2="${T2+H2}" stroke="var(--ink)" stroke-width=".7" opacity="0"/>
  </svg>`;
}

function bucketTable(G, g){
  const b = G.baseline;
  return `<div class="tbl"><table>
    <tr><th>Reading</th><th>Share of days</th><th>Spells</th><th>Lower 1 month later</th>
        <th>Median 3-month change</th><th>Median worst dip, 3m</th><th>Worst dip, 3m</th></tr>
    ${g.buckets.map((r,k)=>`<tr class="${k===g.today_bucket?'now':''}"><td>${r.bucket}${k===g.today_bucket?' ← today':''}</td>
      <td>${r.share??'–'}%</td><td>${r.episodes_done}</td><td>${r.lower_1m??'–'}${r.lower_1m!=null?'%':''}</td>
      <td>${pc(r.med_3m)}</td><td>${pc(r.med_dd)}</td><td>${pc(r.worst_dd)}</td></tr>`).join('')}
    <tr class="base"><td>All days</td><td>100%</td><td>–</td><td>${b.lower_1m}%</td>
      <td>${pc(b.med_3m)}</td><td>${pc(b.med_dd)}</td><td>${pc(b.worst_dd)}</td></tr>
  </table></div>`;
}

function episodeTable(g){
  const e = (g.episodes||[]).slice().reverse();
  if(!e.length) return '<p class="stamp">No past spells in this range.</p>';
  return `<div class="tbl"><table>
    <tr><th>Began</th><th>Ended</th><th>Sessions</th><th>Reading at start</th>
        <th>1 month after start</th><th>3 months after start</th><th>Worst dip, 3m</th></tr>
    ${e.map(r=>`<tr><td>${r.start}</td><td>${r.end}</td><td>${r.sessions}</td><td>${r.reading??'–'}</td>
      <td>${pc(r.r21)}</td><td>${r.open?'still running':pc(r.r63)}</td><td>${r.open?'–':pc(r.dd)}</td></tr>`).join('')}
  </table></div>`;
}

function openHistory(id, file){
  const box = document.getElementById('hist-' + id);
  const btn = document.querySelector(`[data-hist="${id}"]`);
  if(!box.hidden){ box.hidden = true; btn.textContent = 'show history ▸'; return; }
  box.hidden = false; btn.textContent = 'hide history ▾';
  if(box.dataset.done) return;
  box.innerHTML = '<div class="rd">loading history…</div>';
  loadGauges(file).then(G => {
    const g = G.gauges[id];
    if(!g){ box.innerHTML = '<div class="rd">No history stored for this gauge.</div>'; return; }
    box.dataset.done = '1';
    box.innerHTML = `
      <div class="rd" id="rd-${id}">Move across the chart to read any day.</div>
      ${gaugeChart(G, g, id)}
      <p class="stamp" style="margin-top:4px">Shaded: days the gauge was in today's range (${
        ['0–20','20–40','40–60','60–80','80–100'][g.today_bucket]}).${g.lag?' Weekly data, shifted a week later to match publication.':''}</p>
      <h3>What the index did next, by reading</h3>
      ${bucketTable(G, g)}
      <p class="stamp" style="margin-top:6px">If the rows do not get worse as the reading gets louder,
        the gauge is not adding much on its own. “Spells” is the real sample size — neighbouring days are the same event.</p>
      <h3>Every spell in today's range, newest first</h3>
      ${episodeTable(g)}`;
    const svg = box.querySelector('svg'), rd = document.getElementById('rd-' + id), xh = svg.querySelector('.xh');
    const n = G.dates.length, PL = 34, iw = 880 - 34 - 10;
    const move = ev => {
      const pt = ev.touches ? ev.touches[0] : ev;
      const r = svg.getBoundingClientRect();
      const x = (pt.clientX - r.left) / r.width * 880;
      const k = Math.max(0, Math.min(n-1, Math.round((x - PL) / iw * (n-1))));
      const xx = PL + k/(n-1)*iw;
      xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('opacity', '.5');
      const v = g.value[k], rr = g.reading[k];
      rd.textContent = `${G.dates[k]} · value ${v==null?'–':v} · reading ${rr==null?'–':rr} · SPY ${G.spy[k]}`
        + ` · next month ${pc(G.fwd21[k])} · next 3 months ${pc(G.fwd63[k])}`;
    };
    svg.addEventListener('mousemove', move);
    svg.addEventListener('touchmove', move, {passive:true});
  }).catch(() => { box.innerHTML = '<div class="rd">History file not found yet — it appears after the next nightly run.</div>'; });
}

function thin(rows, key, target){
  // 2700 daily points in 850px is three points per pixel -- a hairball no
  // amount of styling fixes. Aggregate into buckets and keep the MAX of each,
  // because for a risk gauge the peak of a week is the information and the
  // mean of a week is not.
  if(rows.length <= target) return rows;
  const step = Math.ceil(rows.length/target), out=[];
  for(let i=0;i<rows.length;i+=step){
    const seg = rows.slice(i, i+step);
    let best = seg[0];
    for(const r of seg) if(r[key] > best[key]) best = r;
    out.push({date: seg[Math.floor(seg.length/2)].date, [key]: best[key]});
  }
  if(out[out.length-1].date !== rows[rows.length-1].date) out.push(rows[rows.length-1]);
  return out;
}

function historyPanel(d){
  const hAll = (d.history||[]).filter(x => Number.isFinite(x.score));
  if(hAll.length < 60) return '';
  const h = thin(hAll, 'score', 320);
  const th = thin((d.top_history||[]).filter(x => Number.isFinite(x.top)), 'top', 320);

  // Two stacked panels sharing one x-axis. The two series answer different
  // questions on different scales; overlaying them made both unreadable.
  const W=880, PL=34, PR=10, PT=10, GAP=16;
  const H1=185, H2=86, H=PT+H1+GAP+H2+26;
  const iw=W-PL-PR;
  const t0=new Date(hAll[0].date).getTime(), t1=new Date(hAll[hAll.length-1].date).getTime();
  const X = ms => PL + (ms-t0)/(t1-t0)*iw;
  const Y1 = v => PT + (100-v)/100*H1;
  const T2 = PT+H1+GAP;
  const Y2 = v => T2 + (100-v)/100*H2;

  const band=(a,b,c)=>`<rect x="${PL}" y="${Y1(b)}" width="${iw}" height="${Y1(a)-Y1(b)}" fill="${c}"/>`;
  const line=(pts,acc,Yf)=>pts.map((x,i)=>(i?'L':'M')+X(new Date(x.date).getTime()).toFixed(1)
      +' '+Yf(acc(x)).toFixed(1)).join(' ');

  const yrs=[]; for(let y=new Date(t0).getFullYear(); y<=new Date(t1).getFullYear(); y++){
    const ms=new Date(y+'-01-01').getTime(); if(ms>=t0&&ms<=t1) yrs.push([y,ms]); }
  const piv=((d.pivots&&d.pivots.pivots)||[]).filter(p=>{
    const ms=new Date(p.date).getTime(); return ms>=t0&&ms<=t1; });
  const last=h[h.length-1];
  const inRange = x => { const ms=new Date(x.date).getTime(); return ms>=t0&&ms<=t1; };
  const tp = th.filter(inRange);
  const lastT = tp.length?tp[tp.length-1]:null;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="Stress score and topping risk over ${hAll.length} sessions">
    ${band(0,35,'#E4EFE9')}${band(35,60,'#F5EEE0')}${band(60,80,'#F7E4E1')}${band(80,100,'#EFD3D0')}
    ${[0,35,60,80,100].map(v=>`<line x1="${PL}" y1="${Y1(v)}" x2="${W-PR}" y2="${Y1(v)}"
        stroke="var(--rule)" stroke-width=".6"/>
      <text x="${PL-5}" y="${Y1(v)+3}" text-anchor="end" font-size="9"
        font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join('')}

    <rect x="${PL}" y="${T2}" width="${iw}" height="${H2}" fill="#FBFCFD" stroke="var(--rule)" stroke-width=".6"/>
    ${[0,50,100].map(v=>`<text x="${PL-5}" y="${Y2(v)+3}" text-anchor="end" font-size="9"
        font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join('')}
    <line x1="${PL}" y1="${Y2(60)}" x2="${W-PR}" y2="${Y2(60)}" stroke="var(--danger)"
      stroke-width=".6" stroke-dasharray="3 3" opacity=".5"/>

    ${yrs.map(([y,ms])=>`<line x1="${X(ms)}" y1="${PT}" x2="${X(ms)}" y2="${T2+H2}"
        stroke="var(--rule)" stroke-width=".6" stroke-dasharray="2 3" opacity=".7"/>
      <text x="${X(ms)}" y="${H-8}" text-anchor="middle" font-size="9"
        font-family="var(--mono)" fill="var(--muted)">${y}</text>`).join('')}

    ${piv.map(p=>{const x=X(new Date(p.date).getTime()); const low=p.kind==='low';
      const c=low?'var(--calm)':'var(--danger)';
      return `<line x1="${x}" y1="${low?PT:T2}" x2="${x}" y2="${low?PT+H1:T2+H2}"
          stroke="${c}" stroke-width=".8" stroke-dasharray="3 3" opacity=".5"/>
        <path d="${low?`M${x-4} ${PT+H1} L${x+4} ${PT+H1} L${x} ${PT+H1-7} Z`
                     :`M${x-4} ${T2} L${x+4} ${T2} L${x} ${T2+7} Z`}"
          fill="${c}"><title>${p.name} — ${p.verdict}</title></path>`;}).join('')}

    <path d="${line(h,x=>x.score,Y1)}" fill="none" stroke="#2C3A47" stroke-width="1.3"/>
    <circle cx="${X(new Date(last.date).getTime())}" cy="${Y1(last.score)}" r="3.4" fill="var(--ink)"/>
    ${tp.length>10?`<path d="${line(tp,x=>x.top,Y2)}" fill="none" stroke="var(--danger)"
        stroke-width="1.1" opacity=".85"/>
      <circle cx="${X(new Date(lastT.date).getTime())}" cy="${Y2(lastT.top)}" r="3.2"
        fill="var(--danger)"/>`:''}

    <text x="${PL+4}" y="${PT+12}" font-size="9.5" font-family="var(--mono)"
      fill="var(--muted)">STRESS SCORE</text>
    <text x="${PL+4}" y="${T2+13}" font-size="9.5" font-family="var(--mono)"
      fill="var(--danger)" opacity=".8">TOPPING RISK</text>
  </svg>
  <p class="lede" style="margin-top:8px">
    Upper panel is the stress score, which peaks at lows — green triangles.
    Lower panel is topping risk, which is what tops are judged on — red triangles.
    They are deliberately on separate axes; they answer different questions.
    ${d.score_percentile!=null?`Today's stress reads higher than <strong>${d.score_percentile}%</strong>
    of sessions since ${hAll[0].date}. Peaks are preserved; the line is bucketed so ${hAll.length} sessions fit legibly.`:''}</p>`;
}


function sparkline(hist){
  if(!hist || hist.length < 3) return '<div class="stamp">history builds from here</div>';
  const pts0 = hist.filter(h => Number.isFinite(h.score));
  const v = pts0.map(h => h.score);
  const w = 320, h = 58, lo = Math.min(...v), hi = Math.max(...v), rng = (hi-lo)||1;
  const y = s => h - (s-lo)/rng*(h-14) - 7;
  const pts = v.map((s,i) => [i/(v.length-1)*w, y(s)]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const yrs = ((new Date(pts0[pts0.length-1].date)-new Date(pts0[0].date))/31557600000).toFixed(1);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
            role="img" aria-label="Risk score over ${pts0.length} sessions">
      <line x1="0" y1="${y(hi).toFixed(1)}" x2="${w}" y2="${y(hi).toFixed(1)}"
            stroke="var(--rule)" stroke-dasharray="2 3"/>
      <line x1="0" y1="${y(lo).toFixed(1)}" x2="${w}" y2="${y(lo).toFixed(1)}"
            stroke="var(--rule)" stroke-dasharray="2 3"/>
      <path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="var(--ink)"/>
      <text x="2" y="${(y(hi)-3).toFixed(1)}" font-size="9" fill="var(--muted)"
            font-family="var(--mono)">${hi.toFixed(0)}</text>
      <text x="2" y="${(y(lo)+10).toFixed(1)}" font-size="9" fill="var(--muted)"
            font-family="var(--mono)">${lo.toFixed(0)}</text>
    </svg>
    <div class="stamp">${pts0[0].date} to today &middot; ${yrs} years of readings</div>`;
}

function rung(i){
  const c = colorFor(i.percentile);
  return `<li class="rung">
    <div class="name">${i.label}${i.stale ? ' <span class="stale">stale</span>' : ''}${i.thin_history ? ' <span class="stale thin">thin history</span>' : ''}${i.inverted ? ' <span class="inv" title="the raw number runs the other way: lower readings mean more concern">lower = worse</span>' : ''}${i.clipped ? ` <span class="inv clip" title="value is past the end of this gauge's scale (${i.scale_lo} to ${i.scale_hi}), so the bar cannot move further">at scale limit</span>` : ''}${i.plain ? `<span class="note">${i.plain}</span>` : (i.note ? `<span class="note">${i.note}</span>` : '')}
      ${(i.compare||i.worry||i.ignore) ? `<div class="guide">
        ${i.compare?`<div><b>Read against</b>${i.compare}</div>`:''}
        ${i.worry?`<div class="w"><b>Worry when</b>${i.worry}</div>`:''}
        ${i.ignore?`<div><b>Ignore</b>${i.ignore}</div>`:''}
      </div>` : (i.check ? `<span class="check">${i.check}</span>` : '')}
      ${pastLine(i)}
      ${i.history ? `<button class="hbtn" data-hist="${i.id}" onclick="openHistory('${i.id}', window.GFILE)">show history ▸</button>` : ''}</div>
    <div class="track" role="img" aria-label="${i.percentile} out of 100">
      <b style="width:${i.percentile}%;background:${c}"></b>
      <u></u><i style="left:${i.percentile}%;background:${c}"></i>
    </div>
    <div class="figs">${i.display}<em>${i.basis==='absolute scale'?'scale':'rank'} ${i.percentile}</em></div>
    ${i.history ? `<div class="hist" id="hist-${i.id}" hidden></div>` : ''}
  </li>`;
}

function render(d){
  window.GFILE = d.gauge_file || 'gauges.json';
  const b = band(d.score);
  const hot = d.indicators.filter(i => i.percentile >= 70).length;
  const fired = d.signals.filter(s => s.fired);
  const good = new Set(['ts_swing_low','washout_buy','zweig_thrust']);

  document.getElementById('stamp').textContent =
    'updated ' + String(d.updated).replace('T',' ').replace('+00:00',' UTC')
    + (d.build ? '  ·  build ' + d.build : '  ·  build unknown (old code)');

  const q = d.quality || {status:'OK', checks:[], headline:''};
  const untrusted = q.status === 'FAIL';

  document.getElementById('app').innerHTML = `
    ${q.status !== 'OK' ? `<div class="trust ${q.status.toLowerCase()}">
        <strong>${q.status === 'FAIL' ? 'Do not trust tonight’s score.' : 'Check before trusting this.'}</strong>
        ${q.checks.filter(c=>c.status!=='pass').map(c=>`<div class="ck">${c.name} — ${c.detail}</div>`).join('')}
      </div>` : `<div class="trust ok"><strong>Self-checks passed.</strong>
        <span class="ck">${q.checks.length} checks — values possible, feeds current, gauges agree.</span></div>`}

    <div class="read${untrusted?' dim':''}">
      <div class="score" style="color:${b.color}">${d.score}<small>${b.key}</small>
        ${d.score_percentile!=null?`<small class="pctl">${d.score_percentile} pctl of record</small>`:''}
        ${untrusted?'<small class="muted-note">greyed out — failed a self-check above</small>':''}</div>
      <div>
        <p class="plain"><strong>${b.say}</strong>
          ${hot ? `${hot} of ${d.indicators.length} gauges are in the top third of their own three-year range.`
                : 'No individual gauge is stretched.'}</p>
        <span class="regime">${d.regime.name} — ${d.regime.description || ''}</span>
        ${priceStrip(d.price_state)}
        ${trendStrip(d.trend)}
        ${toppingStrip(d.topping)}
        ${sparkline(d.history)}
      </div>
    </div>

    <section>
      <h2>Where this sits historically</h2>
      <p class="lede">The whole record, with the bands the score is read against.
        Turning points are marked so you can see what the monitor was doing when
        price actually changed direction.</p>
      ${historyPanel(d)}
    </section>

    <section>
      <h2>What is loud right now</h2>
      <p class="lede">Each bar is that gauge's position within its own last three years —
        far right means today is near the most extreme reading it has produced in that window.
        Grouped by family, loudest family first — the shape of which families are lit
        matters more than any single bar. Under each gauge: what it measures, what to read it
        against, the combination that means something, and the reading that looks alarming but is not.
        The last one matters most —
        the reading on its own is only half of the information.
        A <span class="stale thin">thin history</span> tag means that gauge is ranked against
        less than two years of data. <span class="inv clip">at scale limit</span> means the value
        has run past the end of its scale, so the bar has stopped moving and only the raw
        number still carries information.</p>
      ${(()=>{
        const fams={};
        d.indicators.forEach(i=>{(fams[i.family||'Other']=fams[i.family||'Other']||[]).push(i);});
        const order=Object.keys(fams).sort((a,b)=>
          Math.max(...fams[b].map(x=>x.percentile))-Math.max(...fams[a].map(x=>x.percentile)));
        return order.map(f=>{
          const g=fams[f].sort((a,b)=>b.percentile-a.percentile);
          const hi=Math.max(...g.map(x=>x.percentile));
          return `<div class="fam">
            <div class="famhead"><span>${f}</span>
              <span class="fambar"><i style="width:${hi}%;background:${colorFor(hi)}"></i></span>
              <span class="famnum">${hi}</span></div>
            <ul class="ladder">${g.map(rung).join('')}</ul></div>`;}).join('');
      })()}
    </section>

    <section>
      <h2>Signals</h2>
      <p class="lede">These are yes/no conditions, not opinions. One firing alone is noise;
        several at once is the thing to notice.</p>
      <div>${d.signals.map(s => `
        <div class="sig ${s.fired?'on':'off'} ${good.has(s.id)?'good':''}">
          <span class="dot"></span>
          <div><span class="lbl">${s.label}</span>
            <div class="mean">${s.meaning}</div></div>
        </div>`).join('')}</div>
      ${fired.length ? '' : '<p class="lede" style="margin-top:14px">Nothing is firing today.</p>'}
    </section>

    ${d.thrusts ? `<section>
      <h2>Zweig breadth thrusts</h2>
      <p class="lede">The ten-day average of advancing share travelling from under 40%
        to over 61.5% within ten sessions — a total flip from selling to buying.
        Genuinely rare, so an empty list is its normal state and means nothing.
        Built on the S&P 500 rather than Zweig's NYSE all-issues, so the thresholds
        are not calibrated to this universe.</p>
      ${d.thrusts.length ? `<div>${d.thrusts.slice().reverse().map(t=>`
        <div class="sig on good"><span class="dot"></span>
          <div><span class="lbl">${t.date}</span>
            <div class="mean">10-day advancing share reached ${(t.ratio*100).toFixed(1)}%${
              t.fwd_6m_pct!=null?` — index ${t.fwd_6m_pct>0?'+':''}${t.fwd_6m_pct}% over the following six months`:''}</div>
          </div></div>`).join('')}</div>
        <p class="foot" style="margin-top:14px">${d.thrusts.length} thrust${d.thrusts.length===1?'':'s'}
          in the record. The forward-return column is the whole test: if it is not
          consistently positive, the signal is not doing what it claims.</p>`
        : '<p class="lede">None in the record.</p>'}
    </section>` : ''}

    ${d.pivots && d.pivots.status === 'ok' ? `<section>
      <h2>Behaviour at turning points</h2>
      <p class="lede">${d.pivots.note}</p>
      <div>${d.pivots.pivots.map(p=>`<div class="sig ${p.useful?(p.kind==='low'?'on good':'on'):'off'}">
          <span class="dot"></span>
          <div><span class="lbl">${p.name}</span>
            <div class="mean">${p.kind==='low'?'LOW':'TOP'} ${p.date} — <em>${p.measure} score</em> —
              score ${p.score} (${p.percentile} pctl)${p.change_before!=null?
              `, ${p.change_before>0?'+':''}${p.change_before} vs the six weeks before`:''} — ${p.verdict}</div></div>
        </div>`).join('')}</div>
      <p class="foot" style="margin-top:14px">Lows caught:
        ${d.pivots.lows_useful}/${d.pivots.lows_tested}.
        Tops caught: <strong>${d.pivots.tops_useful}/${d.pivots.tops_tested}</strong> — the number that matters.</p>
    </section>` : ''}

    ${d.events && d.events.status === 'ok' ? `<section>
      <h2>Track record</h2>
      <p class="lede">Did the score actually rise during known stress? Tested against
        episodes chosen in advance, not picked to flatter the result.
        Flagged means it reached its own top fifth.</p>
      <div>${d.events.episodes.map(e=>`<div class="sig ${e.flagged?'on good':'off'}">
          <span class="dot"></span>
          <div><span class="lbl">${e.name}</span>
            <div class="mean">${e.date} — peak score ${e.peak_score}
              (${e.percentile} percentile)${e.flagged?'':' — missed'}</div></div>
        </div>`).join('')}</div>
      <p class="foot" style="margin-top:14px">${d.events.episodes_flagged} of
        ${d.events.episodes_testable} episodes flagged.
        ${d.events.false_alarm_share !== null ? `Of all days in the top tenth,
        ${Math.round(d.events.false_alarm_share*100)}% came outside any of these episodes.
        ${d.events.baseline_away_share!=null?`Firing at random would put
        ${Math.round(d.events.baseline_away_share*100)}% outside, so the gauge is
        ${d.events.false_alarm_share < d.events.baseline_away_share ? 'better than chance' : 'no better than chance'}
        — but only these nine episodes are tested, so real stress that is not on the
        list counts against it here. Treat it as a ceiling on the false-alarm rate.`:''}` : ''}</p>
    </section>` : ''}

    ${d.notes && d.notes.length ? `<p class="foot" style="margin-top:22px">${d.notes.join(' · ')}</p>` : ''}

    ${d.demo ? `<div class="warn"><strong>This is sample data.</strong>
        It ships with the repo so the page has something to show. Your first real
        run overwrites it.</div>` : ''}

    ${d.errors && d.errors.length ? `<div class="warn"><strong>Some feeds did not report.</strong>
        The score was rebalanced across what did arrive, so it is still readable, but it is
        built on fewer inputs than usual.<br>${d.errors.map(e=>`<code>${e}</code>`).join(' ')}</div>` : ''}

    <p class="foot">Every gauge is ranked against its own history rather than a fixed threshold,
      so the score answers “how unusual is this?”, not “how bad is this?”.
      A high reading is a statement about conditions, not a forecast.</p>`;
}

fetch('data.json?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(() => {
    document.getElementById('stamp').textContent = 'no data yet';
    document.getElementById('app').innerHTML = `<div class="empty">
      <h2>No readings yet</h2>
      <p class="lede">This page shows whatever is in <code>data.json</code> next to it.
        Run <code>python risk_monitor.py</code> once, or trigger the
        <strong>Daily Risk Monitor</strong> action on GitHub, and this fills in.</p></div>`;
  });
</script>
</body>
</html>
