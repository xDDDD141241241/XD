<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#E9ECF1; --panel:#FBFCFD; --ink:#0E141B; --muted:#63748A;
    --rule:#C4CEDA; --track:#D8DFE8;
    --calm:#2A7F62; --caution:#C07A1E; --danger:#B02A24; --acute:#7B1E1A;
    --display:'IBM Plex Sans Condensed',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 72px}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  header{display:flex;justify-content:space-between;align-items:baseline;
         gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
  h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.14em;
     text-transform:uppercase;margin:0}
  .stamp{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  /* ---- headline reading ---- */
  .read{background:var(--panel);border:1px solid var(--rule);border-top:none;
        padding:22px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  .score{font-family:var(--display);font-weight:700;font-size:76px;line-height:.85;
         letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .score small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;
               letter-spacing:.16em;margin-top:10px;text-transform:uppercase}
  .plain{font-size:17px;max-width:52ch}
  .plain strong{font-weight:600}
  .regime{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);
          margin-top:10px;display:block;text-transform:uppercase}
  .spark{margin-top:14px}
  .trend{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .tf{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:3px 7px;
      border:1px solid var(--rule);background:#fff;display:inline-flex;gap:5px;align-items:baseline}
  .tf b{font-weight:600}
  .tf i{font-style:normal;color:var(--muted)}
  .tf.up{border-left:3px solid var(--calm)}
  .tf.dn{border-left:3px solid var(--caution)}

  /* ---- signature: the percentile ladder stack ---- */
  section{margin-top:34px}
  h2{font-family:var(--display);font-size:12.5px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
  .lede{font-size:13.5px;color:var(--muted);margin:0 0 16px;max-width:62ch}

  .ladder{list-style:none;margin:0;padding:0}
  .rung{display:grid;grid-template-columns:1fr 168px 62px;gap:14px;align-items:center;
        padding:11px 0;border-bottom:1px solid var(--rule)}
  .rung:first-child{border-top:1px solid var(--rule)}
  .name{font-size:14px}
  .note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .track{position:relative;height:16px;background:var(--track);border-radius:1px}
  .track i{position:absolute;top:-3px;width:3px;height:22px;background:var(--ink);
           transform:translateX(-1.5px)}
  .track b{position:absolute;top:0;bottom:0;left:0;opacity:.30}
  .track u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#fff;opacity:.7}
  .figs{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .figs em{display:block;font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.03em}

  /* ---- signals ---- */
  .sig{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start;
       padding:11px 0;border-bottom:1px solid var(--rule)}
  .sig:first-child{border-top:1px solid var(--rule)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--track);margin-top:6px}
  .sig.on .dot{background:var(--danger)}
  .sig.on.good .dot{background:var(--calm)}
  .sig .lbl{font-weight:600;font-size:14px}
  .sig.off{color:var(--muted)}
  .sig.off .lbl{font-weight:400}
  .sig .mean{font-size:12.5px;color:var(--muted)}

  .trust{border:1px solid var(--rule);border-bottom:none;background:var(--panel);
         padding:12px 22px;font-size:13.5px}
  .trust.ok{color:var(--calm)}
  .trust.warn{background:#FBF1DF;border-color:#E4CDA0;color:#7A5210}
  .trust.fail{background:#F6E4E2;border-color:#DFB3AE;color:#8C201A}
  .trust .ck{font-size:12.5px;color:inherit;opacity:.85;margin-top:3px}
  .read.dim{opacity:.45}
  .foot{margin-top:34px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);
        padding-top:14px}
  .warn{background:#F6E9E7;border:1px solid #E0BDB8;padding:12px 14px;font-size:13px;
        margin-top:16px}
  .empty{background:var(--panel);border:1px solid var(--rule);padding:28px;margin-top:20px}
  .stale{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
         background:var(--caution);color:#fff;padding:1px 5px;border-radius:2px;vertical-align:2px}
  code{font-family:var(--mono);font-size:12.5px;background:var(--track);padding:1px 5px}

  @media (max-width:620px){
    .read{grid-template-columns:1fr;gap:16px}
    .score{font-size:62px}
    .rung{grid-template-columns:1fr 84px;grid-template-areas:"n f" "t t";gap:6px 12px}
    .name{grid-area:n}.figs{grid-area:f}.track{grid-area:t}
  }
  @media (prefers-reduced-motion:no-preference){
    .rung,.sig{animation:in .4s ease both}
  }
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Risk Monitor</h1>
    <span class="stamp" id="stamp">loading…</span>
  </header>
  <div id="app"></div>
</div>

<script>
const BANDS = [
  {max:35, key:'CALM',      color:'var(--calm)',    say:'Nothing in the complex is flashing. Normal conditions.'},
  {max:60, key:'ELEVATED',  color:'var(--caution)', say:'Some gauges are running warm. Worth a look, not a reaction.'},
  {max:80, key:'STRESSED',  color:'var(--danger)',  say:'Several gauges are stretched at once. This is when position size matters.'},
  {max:101,key:'ACUTE',     color:'var(--acute)',   say:'Broad, simultaneous stress. Historically the tail of the distribution.'}
];
const band = s => BANDS.find(b => s < b.max) || BANDS[3];
const colorFor = p => p >= 80 ? 'var(--danger)' : p >= 60 ? 'var(--caution)' : 'var(--calm)';

const REGIME = {
  BULL:          'Price above trend and participation is broad.',
  DETERIORATING: 'Price is still holding up, but fewer stocks are carrying it.',
  CORRECTION:    'Price has broken trend, though breadth has not confirmed real damage.',
  BEAR:          'Both price trend and participation are broken.'
};

function trendStrip(t){
  if(!t || !t.length) return '';
  return `<div class="trend">${t.map(x => `
    <span class="tf ${x.above?'up':'dn'}">
      <b>${x.span}${x.kind}</b>${x.above?'above':'below'}
      <i>${x.dist_pct>0?'+':''}${x.dist_pct}%</i></span>`).join('')}
    <div class="stamp" style="margin-top:6px">price vs each horizon — short and long can disagree, and usually do in a pullback</div></div>`;
}


function historyPanel(d){
  const h = (d.history||[]).filter(x => Number.isFinite(x.score));
  if(h.length < 60) return '';
  const W=880, H=230, PL=34, PR=10, PT=10, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const t0=new Date(h[0].date).getTime(), t1=new Date(h[h.length-1].date).getTime();
  const X = ms => PL + (ms-t0)/(t1-t0)*iw;
  const Y = v  => PT + (100-v)/100*ih;
  const band = (a,b,c) => `<rect x="${PL}" y="${Y(b)}" width="${iw}" height="${Y(a)-Y(b)}" fill="${c}"/>`;
  const d3 = h.map((x,i)=>(i?'L':'M')+X(new Date(x.date).getTime()).toFixed(1)+' '+Y(x.score).toFixed(1)).join(' ');
  const last = h[h.length-1];
  const piv = ((d.pivots&&d.pivots.pivots)||[]).filter(p=>{
    const ms=new Date(p.date).getTime(); return ms>=t0 && ms<=t1; });
  const yrs=[]; for(let y=new Date(t0).getFullYear(); y<=new Date(t1).getFullYear(); y++){
    const ms=new Date(y+'-01-01').getTime(); if(ms>=t0&&ms<=t1) yrs.push([y,ms]); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="Risk score history with turning points marked">
    ${band(0,35,'#E4EFE9')}${band(35,60,'#F5EEE0')}${band(60,80,'#F7E4E1')}${band(80,100,'#EFD3D0')}
    ${[0,35,60,80,100].map(v=>`<line x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}"
        stroke="var(--rule)" stroke-width=".6"/>
      <text x="${PL-5}" y="${Y(v)+3}" text-anchor="end" font-size="9"
        font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join('')}
    ${yrs.map(([y,ms])=>`<line x1="${X(ms)}" y1="${PT}" x2="${X(ms)}" y2="${PT+ih}"
        stroke="var(--rule)" stroke-width=".6" stroke-dasharray="2 3"/>
      <text x="${X(ms)}" y="${H-8}" text-anchor="middle" font-size="9"
        font-family="var(--mono)" fill="var(--muted)">${y}</text>`).join('')}
    <path d="${d3}" fill="none" stroke="#41505F" stroke-width="1.1"/>
    ${piv.map(p=>{const x=X(new Date(p.date).getTime()); const low=p.kind==='low';
      return `<line x1="${x}" y1="${PT}" x2="${x}" y2="${PT+ih}" stroke="${low?'var(--calm)':'var(--danger)'}"
          stroke-width=".8" stroke-dasharray="3 3" opacity=".55"/>
        <path d="${low?`M${x-4} ${PT+ih} L${x+4} ${PT+ih} L${x} ${PT+ih-7} Z`
                      :`M${x-4} ${PT} L${x+4} ${PT} L${x} ${PT+7} Z`}"
          fill="${low?'var(--calm)':'var(--danger)'}"><title>${p.name} — ${p.verdict}</title></path>`;}).join('')}
    <line x1="${PL}" y1="${Y(last.score)}" x2="${W-PR}" y2="${Y(last.score)}"
      stroke="var(--ink)" stroke-width=".7" stroke-dasharray="4 3"/>
    <circle cx="${X(new Date(last.date).getTime())}" cy="${Y(last.score)}" r="3.6" fill="var(--ink)"/>
  </svg>
  <p class="lede" style="margin-top:8px">
    Green triangles are confirmed lows, red are confirmed tops.
    ${d.score_percentile!=null?`Today reads higher than <strong>${d.score_percentile}%</strong>
    of all sessions since ${h[0].date}.`:''}</p>`;
}

function sparkline(hist){
  if(!hist || hist.length < 3) return '<div class="stamp">history builds from here</div>';
  const pts0 = hist.filter(h => Number.isFinite(h.score));
  const v = pts0.map(h => h.score);
  const w = 320, h = 58, lo = Math.min(...v), hi = Math.max(...v), rng = (hi-lo)||1;
  const y = s => h - (s-lo)/rng*(h-14) - 7;
  const pts = v.map((s,i) => [i/(v.length-1)*w, y(s)]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const yrs = (pts0.length/252).toFixed(1);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
            role="img" aria-label="Risk score over ${pts0.length} sessions">
      <line x1="0" y1="${y(hi).toFixed(1)}" x2="${w}" y2="${y(hi).toFixed(1)}"
            stroke="var(--rule)" stroke-dasharray="2 3"/>
      <line x1="0" y1="${y(lo).toFixed(1)}" x2="${w}" y2="${y(lo).toFixed(1)}"
            stroke="var(--rule)" stroke-dasharray="2 3"/>
      <path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.3"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="var(--ink)"/>
      <text x="2" y="${(y(hi)-3).toFixed(1)}" font-size="9" fill="var(--muted)"
            font-family="var(--mono)">${hi.toFixed(0)}</text>
      <text x="2" y="${(y(lo)+10).toFixed(1)}" font-size="9" fill="var(--muted)"
            font-family="var(--mono)">${lo.toFixed(0)}</text>
    </svg>
    <div class="stamp">${pts0[0].date} to today &middot; ${yrs} years of readings</div>`;
}

function rung(i){
  const c = colorFor(i.percentile);
  return `<li class="rung">
    <div class="name">${i.label}${i.stale ? ' <span class="stale">stale</span>' : ''}${i.note ? `<span class="note">${i.note}</span>` : ''}</div>
    <div class="track" role="img" aria-label="${i.percentile} out of 100">
      <b style="width:${i.percentile}%;background:${c}"></b>
      <u></u><i style="left:${i.percentile}%;background:${c}"></i>
    </div>
    <div class="figs">${i.display}<em>rank ${i.percentile}</em></div>
  </li>`;
}

function render(d){
  const b = band(d.score);
  const hot = d.indicators.filter(i => i.percentile >= 70).length;
  const fired = d.signals.filter(s => s.fired);
  const good = new Set(['ts_swing_low','washout_buy','zweig_thrust']);

  document.getElementById('stamp').textContent =
    'updated ' + String(d.updated).replace('T',' ').replace('+00:00',' UTC');

  const q = d.quality || {status:'OK', checks:[], headline:''};
  const untrusted = q.status === 'FAIL';

  document.getElementById('app').innerHTML = `
    ${q.status !== 'OK' ? `<div class="trust ${q.status.toLowerCase()}">
        <strong>${q.status === 'FAIL' ? 'Do not trust tonight’s score.' : 'Check before trusting this.'}</strong>
        ${q.checks.filter(c=>c.status!=='pass').map(c=>`<div class="ck">${c.name} — ${c.detail}</div>`).join('')}
      </div>` : `<div class="trust ok"><strong>Self-checks passed.</strong>
        <span class="ck">${q.checks.length} checks — values possible, feeds current, gauges agree.</span></div>`}

    <div class="read${untrusted?' dim':''}">
      <div class="score" style="color:${b.color}">${d.score}<small>${b.key}</small></div>
      <div>
        <p class="plain"><strong>${b.say}</strong>
          ${hot ? `${hot} of ${d.indicators.length} gauges are in the top third of their own three-year range.`
                : 'No individual gauge is stretched.'}</p>
        <span class="regime">${d.regime.name} — ${d.regime.description || ''}</span>
        ${trendStrip(d.trend)}
        ${sparkline(d.history)}
      </div>
    </div>

    <section>
      <h2>Where this sits historically</h2>
      <p class="lede">The whole record, with the bands the score is read against.
        Turning points are marked so you can see what the monitor was doing when
        price actually changed direction.</p>
      ${historyPanel(d)}
    </section>

    <section>
      <h2>What is loud right now</h2>
      <p class="lede">Each bar is that gauge's position within its own last three years —
        far right means today is near the most extreme reading it has produced in that window.
        Sorted loudest first.</p>
      <ul class="ladder">${d.indicators.map(rung).join('')}</ul>
    </section>

    <section>
      <h2>Signals</h2>
      <p class="lede">These are yes/no conditions, not opinions. One firing alone is noise;
        several at once is the thing to notice.</p>
      <div>${d.signals.map(s => `
        <div class="sig ${s.fired?'on':'off'} ${good.has(s.id)?'good':''}">
          <span class="dot"></span>
          <div><span class="lbl">${s.label}</span>
            <div class="mean">${s.meaning}</div></div>
        </div>`).join('')}</div>
      ${fired.length ? '' : '<p class="lede" style="margin-top:14px">Nothing is firing today.</p>'}
    </section>

    ${d.pivots && d.pivots.status === 'ok' ? `<section>
      <h2>Behaviour at turning points</h2>
      <p class="lede">${d.pivots.note}</p>
      <div>${d.pivots.pivots.map(p=>`<div class="sig ${p.useful?(p.kind==='low'?'on good':'on'):'off'}">
          <span class="dot"></span>
          <div><span class="lbl">${p.name}</span>
            <div class="mean">${p.kind==='low'?'LOW':'TOP'} ${p.date} —
              score ${p.score} (${p.percentile} pctl)${p.change_before!=null?
              `, ${p.change_before>0?'+':''}${p.change_before} vs the six weeks before`:''} — ${p.verdict}</div></div>
        </div>`).join('')}</div>
      <p class="foot" style="margin-top:14px">Lows caught:
        ${d.pivots.lows_useful}/${d.pivots.lows_tested}.
        Tops caught: <strong>${d.pivots.tops_useful}/${d.pivots.tops_tested}</strong> — the number that matters.</p>
    </section>` : ''}

    ${d.events && d.events.status === 'ok' ? `<section>
      <h2>Track record</h2>
      <p class="lede">Did the score actually rise during known stress? Tested against
        episodes chosen in advance, not picked to flatter the result.
        Flagged means it reached its own top fifth.</p>
      <div>${d.events.episodes.map(e=>`<div class="sig ${e.flagged?'on good':'off'}">
          <span class="dot"></span>
          <div><span class="lbl">${e.name}</span>
            <div class="mean">${e.date} — peak score ${e.peak_score}
              (${e.percentile} percentile)${e.flagged?'':' — missed'}</div></div>
        </div>`).join('')}</div>
      <p class="foot" style="margin-top:14px">${d.events.episodes_flagged} of
        ${d.events.episodes_testable} episodes flagged.
        ${d.events.false_alarm_share !== null ? `Of all days in the top tenth,
        ${Math.round(d.events.false_alarm_share*100)}% came outside any of these episodes —
        that is the false-alarm rate, and it is the number that keeps this honest.` : ''}</p>
    </section>` : ''}

    ${d.notes && d.notes.length ? `<p class="foot" style="margin-top:22px">${d.notes.join(' · ')}</p>` : ''}

    ${d.demo ? `<div class="warn"><strong>This is sample data.</strong>
        It ships with the repo so the page has something to show. Your first real
        run overwrites it.</div>` : ''}

    ${d.errors && d.errors.length ? `<div class="warn"><strong>Some feeds did not report.</strong>
        The score was rebalanced across what did arrive, so it is still readable, but it is
        built on fewer inputs than usual.<br>${d.errors.map(e=>`<code>${e}</code>`).join(' ')}</div>` : ''}

    <p class="foot">Every gauge is ranked against its own history rather than a fixed threshold,
      so the score answers “how unusual is this?”, not “how bad is this?”.
      A high reading is a statement about conditions, not a forecast.</p>`;
}

fetch('data.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(() => {
    document.getElementById('stamp').textContent = 'no data yet';
    document.getElementById('app').innerHTML = `<div class="empty">
      <h2>No readings yet</h2>
      <p class="lede">This page shows whatever is in <code>data.json</code> next to it.
        Run <code>python risk_monitor.py</code> once, or trigger the
        <strong>Daily Risk Monitor</strong> action on GitHub, and this fills in.</p></div>`;
  });
</script>
</body>
</html>
